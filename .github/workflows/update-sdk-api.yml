name: Update SDK API reference

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Turboism branch, tag, or exact commit to generate from
        required: true
        default: main
        type: string
      mode:
        description: Validate only or sync the generated reference to docs main
        required: true
        default: validate
        type: choice
        options:
          - validate
          - sync
      expected_version:
        description: Optional exact framework version
        required: false
        default: ""
        type: string
      confirmation:
        description: Enter sync-sdk-api when mode is sync
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [sdk-release-published]

permissions:
  contents: write

concurrency:
  group: sdk-api-${{ vars.SDK_DOCS_BRANCH || 'main' }}
  cancel-in-progress: false

env:
  DOCS_BRANCH: ${{ vars.SDK_DOCS_BRANCH || 'main' }}

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DOCS_BRANCH }}

      - name: Resolve requested source
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          MANUAL_SOURCE_REF: ${{ inputs.source_ref }}
          MANUAL_EXPECTED_VERSION: ${{ inputs.expected_version }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            [[ "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$RELEASE_TAG" = "v$RELEASE_VERSION"
            SOURCE_REF="$RELEASE_SOURCE_SHA"
            EXPECTED_VERSION="$RELEASE_VERSION"
            MODE=sync
          else
            test -n "$MANUAL_SOURCE_REF"
            [[ "$MANUAL_SOURCE_REF" != -* ]]
            SOURCE_REF="$MANUAL_SOURCE_REF"
            EXPECTED_VERSION="$MANUAL_EXPECTED_VERSION"
            MODE="$MANUAL_MODE"
            case "$MODE" in
              validate) ;;
              sync) test "$MANUAL_CONFIRMATION" = sync-sdk-api ;;
              *) exit 1 ;;
            esac
            if [ -n "$EXPECTED_VERSION" ]; then
              [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            fi
          fi
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "expected_version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Check out exact Turboism source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: turboism/Turboism
          ref: ${{ steps.request.outputs.source_ref }}
          path: turboism-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ steps.request.outputs.source_ref }}
          REQUESTED_VERSION: ${{ steps.request.outputs.expected_version }}
          RELEASE_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REVISION="$(git -C turboism-source rev-parse HEAD)"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$RELEASE_SOURCE_SHA" ]; then
            test "$REVISION" = "$RELEASE_SOURCE_SHA"
            TAG_SHA="$(git ls-remote https://github.com/turboism/Turboism.git "refs/tags/$RELEASE_TAG^{}" | cut -f1)"
            if [ -z "$TAG_SHA" ]; then
              TAG_SHA="$(git ls-remote https://github.com/turboism/Turboism.git "refs/tags/$RELEASE_TAG" | cut -f1)"
            fi
            test "$TAG_SHA" = "$REVISION"
            RELEASE_JSON="$(gh api "repos/turboism/Turboism/releases/tags/$RELEASE_TAG")"
            test "$(printf '%s' "$RELEASE_JSON" | jq -r .tag_name)" = "$RELEASE_TAG"
            test "$(printf '%s' "$RELEASE_JSON" | jq -r .draft)" = false
            test "$(printf '%s' "$RELEASE_JSON" | jq -r .prerelease)" = false
          fi
          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("turboism-source/gradle/common-java.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'turboismFrameworkVersion"\]\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text)
          if match is None:
              raise SystemExit("framework version is unavailable")
          print(match.group(1))
          PY
          )"
          if [ -n "$REQUESTED_VERSION" ]; then
            test "$VERSION" = "$REQUESTED_VERSION"
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: turboism-source/**/*.gradle*

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Generate and validate SDK reference
        shell: bash
        env:
          MODE: ${{ steps.request.outputs.mode }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          args=(turboism-source --expected-version="$VERSION")
          if [ "$MODE" = sync ]; then
            args+=(--sync --approved-public-surface --approved-preview-surface)
          fi
          node scripts/sync-sdk-api.mjs "${args[@]}"

      - name: Validate synchronized documentation
        if: steps.request.outputs.mode == 'sync'
        run: |
          npm run release:check
          npm run build

      - name: Commit synchronized SDK reference
        if: steps.request.outputs.mode == 'sync'
        shell: bash
        env:
          REVISION: ${{ steps.source.outputs.revision }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- public/api/sdk)" ]; then
            echo "SDK API reference already matches $VERSION at $REVISION."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/api/sdk
          git commit -m "docs: update SDK API to $VERSION"
          git push origin "HEAD:$DOCS_BRANCH"
